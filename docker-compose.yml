version: "3.8"

services:
  ingenio-os:
    container_name: ingenio_os_app
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN}
      - META_APP_SECRET=${META_APP_SECRET}
      - META_APP_ID=${META_APP_ID}
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/products"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - next-cache:/app/.next/cache
      - legacy-data:/app/public/legacy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  next-cache:
    name: ingenio_os_next_cache
  legacy-data:
    name: ingenio_os_legacy_data
