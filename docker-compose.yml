version: '3.8'

services:
  ingenioia:
    build: .
    restart: always
    ports:
      - "3000:3000"
    environment:
      # Next.js requiere estas variables en runtime y buildtime
      - DATABASE_URL=${DATABASE_URL}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
      - NODE_ENV=production
